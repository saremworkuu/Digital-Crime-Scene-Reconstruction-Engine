id: ssh_bruteforce
name: SSH Brute Force
description: Detect repeated failed SSH logins from one source IP.
severity: high
mitre_technique: T1110

detection:
  group_by: source_ip
  threshold: 3
  window_minutes: 30
  failed_statuses:
    - failed
    - failure
    - unsuccessful
  login_event_types:
    - login
    - ssh_failed
    - failed_login

false_positive_notes:
  - Legitimate users repeatedly entering an incorrect password.
  - Authorized security testing.
