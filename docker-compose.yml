version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://dcsre:dcsre@db:5432/dcsre
      - SECRET_KEY=your-secret-key-here
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=dcsre
      - POSTGRES_PASSWORD=dcsre
      - POSTGRES_DB=dcsre
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
