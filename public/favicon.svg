<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="scanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f95721" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ff936b" stop-opacity="1"/>
      <stop offset="100%" stop-color="#f95721" stop-opacity="0"/>
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded canvas (sleek dark container) -->
  <rect width="128" height="128" rx="28" fill="#141110"/>
  <rect width="128" height="128" rx="28" stroke="#332822" stroke-width="2" fill="none"/>

  <!-- Scanner Frame Brackets (Sensor Viewfinder) -->
  <!-- Top-Left Bracket -->
  <path d="M 22 42 L 22 26 A 4 4 0 0 1 26 22 L 42 22" fill="none" stroke="#f95721" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Top-Right Bracket -->
  <path d="M 86 22 L 102 22 A 4 4 0 0 1 106 26 L 106 42" fill="none" stroke="#f95721" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-Left Bracket -->
  <path d="M 22 86 L 22 102 A 4 4 0 0 0 26 106 L 42 106" fill="none" stroke="#f95721" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Bottom-Right Bracket -->
  <path d="M 106 86 L 106 102 A 4 4 0 0 1 102 106 L 86 106" fill="none" stroke="#f95721" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Fingerprint Biometric Ridges -->
  <!-- Outer Ridge -->
  <path d="M 40 52 C 40 38.7 50.7 28 64 28 C 77.3 28 88 38.7 88 52 C 88 58 87 63 85 68" fill="none" stroke="#f95721" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 40 64 C 40 76 45 86 52 93" fill="none" stroke="#f95721" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 88 78 C 87 84 83 91 76 96" fill="none" stroke="#f95721" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Middle Ridge Loop -->
  <path d="M 48 54 C 48 45.2 55.2 38 64 38 C 72.8 38 80 45.2 80 54 C 80 66 76 76 74 84 C 73 88 70 91 66 91 C 62 91 59 87 59 82 C 59 74 61 68 62 60" fill="none" stroke="#ff7a45" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 48 68 C 48 78 52 84 55 87" fill="none" stroke="#ff7a45" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Inner Ridge / Core Delta -->
  <path d="M 56 56 C 56 51.6 59.6 48 64 48 C 68.4 48 72 51.6 72 56 C 72 65 68 73 68 78" fill="none" stroke="#ff9d75" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 64 62 L 64 71" fill="none" stroke="#ffc4b0" stroke-width="4" stroke-linecap="round"/>

  <!-- Laser Scanning Line Across Center -->
  <line x1="16" y1="64" x2="112" y2="64" stroke="url(#scanGlow)" stroke-width="4" filter="url(#laserGlow)" stroke-linecap="round"/>
  <line x1="24" y1="64" x2="104" y2="64" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="3.5" fill="#ffffff" filter="url(#laserGlow)"/>
</svg>
