    <script>
      // Gracefully prevent injected browser extensions (e.g. MetaMask in sandboxed iframes) from crashing the page
      (function() {
        function isExtensionError(msg, src) {
          var str = String(msg || '').toLowerCase();
          var source = String(src || '').toLowerCase();
          return (
            str.includes('metamask') ||
            str.includes('ethereum') ||
            str.includes('failed to connect') ||
            source.includes('chrome-extension://') ||
            source.includes('moz-extension://') ||
            source.includes('safari-web-extension://')
          );
        }

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var msg = (reason && (reason.message || reason.stack || reason.toString())) || '';
          if (isExtensionError(msg, '')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (isExtensionError(event.message, event.filename)) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
